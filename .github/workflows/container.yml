name: Container

# Build and publish the offline-capable release image to GHCR.
# Dev image (docker/Dockerfile.dev) is built locally by workbench Compose — not published.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - docker/**
      - packages/**
      - scripts/**
      - package.json
      - bun.lock
      - bunfig.toml
      - .dockerignore
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tome
        uses: actions/checkout@v4

      - name: Checkout imp-ts
        uses: actions/checkout@v4
        with:
          repository: silentorb/imp-ts
          path: imp-ts-checkout
          ref: ${{ vars.IMP_REF || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          build-contexts: |
            tome=.
            imp=./imp-ts-checkout
          load: true
          tags: tome-release:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate offline (network none)
        run: |
          docker run --rm --network none tome-release:ci ensure-deps
          docker run --rm --network none tome-release:ci run run typecheck

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          build-contexts: |
            tome=.
            imp=./imp-ts-checkout
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
